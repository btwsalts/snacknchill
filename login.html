<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SnacknChill</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap');
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F0F12;font-family:'Plus Jakarta Sans',sans-serif;padding:20px}
        .card{background:#18181F;border:1px solid #27272A;border-radius:18px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 0 40px rgba(204,255,0,.12)}
        .logo{font-family:Syne,sans-serif;font-weight:800;font-size:1.8rem;text-align:center;color:#CCFF00;margin-bottom:6px}
        .sub{text-align:center;color:#A1A1AA;margin-bottom:24px;font-size:14px}
        label{display:block;color:#A1A1AA;font-size:13px;margin-bottom:6px}
        input[type=text],input[type=password]{width:100%;box-sizing:border-box;background:#0F0F12;border:1px solid #27272A;border-radius:12px;color:#fff;padding:12px 14px;margin-bottom:14px;font-size:15px}
        input:focus{outline:none;border-color:#CCFF00}
        .btn{width:100%;background:#CCFF00;color:#0F0F12;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 0 20px rgba(204,255,0,.35)}
        .btn:hover{filter:brightness(1.05)}
        .err{background:#1c1010;border-left:4px solid #FF007A;color:#fca5a5;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
        .back{display:block;text-align:center;margin-top:18px;color:#71717a;text-decoration:none;font-size:13px}
        .back:hover{color:#FF007A}
        .remember{display:flex;align-items:center;gap:8px;color:#71717a;font-size:13px;margin-bottom:16px}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">SnacknChill</div>
    <p class="sub">Admin Login</p>
    <div class="err" id="err">Demo mode — no real auth. Use any credentials.</div>
    <form id="login-form">
        <label>Username or Email</label>
        <input type="text" name="log" required autofocus>
        <label>Password</label>
        <input type="password" name="pwd" required>
        <label class="remember"><input type="checkbox" name="rememberme" value="1"> Remember me</label>
        <button type="submit" class="btn">Sign In</button>
    </form>
    <a class="back" href="index.html">← Back to site</a>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('err').style.display = 'block';
    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
});
</script>
</body>
</html>
